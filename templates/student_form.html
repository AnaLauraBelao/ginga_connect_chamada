{% extends 'base.html' %}
{% block title %}{{ 'Editar aluno' if student else 'Novo aluno' }} · Capoeira Chamada{% endblock %}
{% block content %}
<section class="narrow-content"><a href="{{ url_for('students_list') }}" class="back-link">← Voltar para alunos</a><span class="eyebrow">CADASTRO</span><h1>{{ 'Editar aluno' if student else 'Novo aluno' }}</h1>
<form method="post" class="panel form-panel stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome completo <input name="name" required maxlength="120" value="{{ student['name'] if student else '' }}"></label><label>Apelido <input name="nickname" maxlength="80" value="{{ student['nickname'] if student else '' }}"></label><label>Corda atual <input name="belt" maxlength="80" placeholder="Ex.: Azul" value="{{ student['belt'] if student else '' }}"></label><button class="button button-primary" type="submit">Salvar aluno</button></form></section>
{% endblock %}
