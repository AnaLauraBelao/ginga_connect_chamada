{% extends 'base.html' %}
{% block title %}Configuração inicial · Capoeira Chamada{% endblock %}
{% block content %}
<section class="narrow-content">
  <span class="eyebrow">PRIMEIRO ACESSO</span>
  <h1>Configurar administrador</h1>
  <p class="muted">Cadastre a pessoa responsável pelo sistema. O crachá gerado ao final será a credencial de acesso administrativo.</p>
  <form method="post" class="panel form-panel stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nome completo <input name="name" required autocomplete="name" maxlength="120"></label>
    <label>Apelido <input name="nickname" maxlength="80"></label>
    <label>Corda atual <input name="belt" maxlength="80" placeholder="Ex.: Amarela e laranja"></label>
    <button class="button button-primary" type="submit">Criar administrador e gerar crachá</button>
  </form>
</section>
{% endblock %}
