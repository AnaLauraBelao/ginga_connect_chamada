services:
  capoeira-chamada:
    build:
      context: .
      args:
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    image: capoeira-chamada:0.6
    container_name: capoeira-chamada
    restart: unless-stopped
    init: true
    ports:
      - "5000:5000"
    environment:
      TZ: America/Sao_Paulo
      CAPOEIRA_HOST: 0.0.0.0
      CAPOEIRA_PORT: "5000"
      CAPOEIRA_DB_PATH: /var/www/app/instance/capoeira.sqlite3
      CAPOEIRA_COOKIE_SECURE: ${CAPOEIRA_COOKIE_SECURE:-0}
    volumes:
      - ./data:/var/www/app/instance
    user: "${PUID:-1000}:${PGID:-1000}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
